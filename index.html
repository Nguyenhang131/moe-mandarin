<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moe Mandarin - Học Tiếng Trung</title>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@2.2/dist/hanzi-writer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro"></script>

<style>
:root {
  --primary: #3C7363;
  --secondary: #ec4899;
  --accent: #FFD700;
  --glass: rgba(255, 255, 255, 0.8);
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}
body {
  margin: 0;
  font-family: 'Quicksand', sans-serif;
  background: #466E73;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  overflow-x: hidden;
  color: #2c3e50;
}
.glass-card {
  background: var(--glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 30px;
  border: 1px solid rgba(255, 255, 255, 0.5);
  box-shadow: var(--shadow);
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
/* Background hai bên */
body::before, body::after {
  content: "";
  position: fixed;
  top: 0;
  width: 50vw;
  height: 100vh;
  z-index: -1;
  background-size: 100% 100%;
  background-repeat: no-repeat;
}
body::before { left: 0; background-image: url('https://www.tnc.com.vn/uploads/newp/n2025/hinh-nen-cute-3082.webp'); }
body::after { right: 0; background-image: url('https://i.pinimg.com/736x/cc/2a/98/cc2a98ae14ae758a89cfef93a07e159b.jpg'); }

.app { width: 100%; max-width: 1800px; padding: 20px; box-sizing: border-box; }
.header {
  position: fixed; top: 10px; left: 10px; padding: 10px 20px;
  font-weight: 800; font-size: 24px;
  background: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(15px);
  border-radius: 15px;
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: var(--primary); z-index: 1000;
  display: flex; align-items: center; gap: 12px;
}
.header-logo { width: 32px; height: 32px; border-radius: 50%; }

.app-container { display: flex; flex-direction: row; gap: 15px; margin-top: 80px; align-items: flex-start; }

/* CỘT 1 */
.col-sidebar {
  flex: 0 0 180px; position: sticky; top: 80px;
  height: calc(100vh - 100px);
  display: flex; flex-direction: column; gap: 15px; z-index: 100;
}
#sheetTabs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
#sheetTabs::-webkit-scrollbar { width: 4px; }
#sheetTabs::-webkit-scrollbar-thumb { background: rgba(60, 115, 99, 0.3); border-radius: 10px; }
.music-box { background: rgba(255, 255, 255, 0.7); padding: 10px; border-radius: 20px; border: 1px solid white; margin-top: auto; }
.tab-btn {
  width: 100%; padding: 12px;
  border: 1px solid rgba(99, 102, 241, 0.3);
  border-radius: 12px; background: rgba(255, 255, 255, 0.6);
  color: var(--primary); cursor: pointer; font-weight: 600; transition: 0.3s;
}
.tab-btn.active { background: var(--primary); color: white; }

/* CỘT 2 */
.main-flashcard { display: flex; flex-direction: row; align-items: center; gap: 40px; padding: 40px; position: relative; overflow: hidden; }
.progress-container { position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: rgba(0,0,0,0.05); }
.bar { height: 100%; background: linear-gradient(90deg, #FFDEE9 0%, #B5FFFC 100%); border-radius: 0 10px 10px 0; }
#mainWordImage {
  width: 240px; height: 240px; object-fit: cover; border-radius: 40px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.15); border: 5px solid white;
}
.word-display {
  font-family: "Kaiti", serif; font-size: 90px !important; color: var(--primary);
  margin: 10px 0; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
}
.btn-premium {
  width: 50px; height: 50px; border: none; border-radius: 18px; background: #ffffff;
  box-shadow: 5px 5px 15px #d1d9e6, -5px -5px 15px #ffffff;
  cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s;
}
.btn-premium:hover { transform: scale(1.1); background: var(--primary); }
.btn-premium:hover img { filter: brightness(0) invert(1); }
.example-card {
  margin-top: 15px; padding: 20px; display: flex; justify-content: space-between; align-items: center;
  background: rgba(255, 255, 255, 0.6); border-radius: 20px; border-left: 6px solid var(--primary); cursor: pointer;
}
.example-card:hover { background: white; transform: translateX(10px); }

/* CỘT 3 */
.col-extra { flex: 1.5; min-width: 250px; display: flex; flex-direction: column; gap: 15px; }
/* CỘT 4 */
.col-chat { flex: 2; min-width: 300px; }
.card {
  background: var(--card-bg); backdrop-filter: blur(12px);
  padding: 25px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.4);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); text-align: center;
}
#exampleBox {
  background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px);
  border-radius: 20px; padding: 15px; margin-top: 20px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.3);
  max-height: 400px; overflow-y: auto;
}
.controls { display: flex; justify-content: center; gap: 8px; }

/* Chat Bubbles */
#dialogueBox { width: 100%; max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.bubble { padding: 12px 18px; border-radius: 18px; max-width: 90%; animation: messengerShow 0.4s ease-out; }
.bubble.left { align-self: flex-start; background: #C5ECBE; color: #243B5D; border-bottom-left-radius: 4px; }
.bubble.right { align-self: flex-end; background: #ACDEAA; color: #1A1A74; border-bottom-right-radius: 4px; text-align: right; }
@keyframes messengerShow { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.bubble .py { font-size: 0.9em; display: block; opacity: 0.8; }
.bubble .zh { font-size: 1.3em; font-weight: 500; display: block; margin: 3px 0; }
.bubble .vi { font-size: 0.9em; font-style: italic; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 3px; display: block; }
.btn-audio-mini { background: none; border: none; cursor: pointer; color: #1a73e8; }
.btn-speed {
  height: 45px; padding: 0 10px; border: 1px solid rgba(0,0,0,0.05);
  border-radius: 12px; background: white; font-weight: 600; color: #3C7363; cursor: pointer;
}

/* ===== AI LUYỆN NÓI ===== */
#aiFab{position:fixed;right:20px;bottom:20px;z-index:2000;border:none;border-radius:30px;padding:14px 20px;background:var(--primary);color:#fff;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#aiPanel{position:fixed;right:20px;bottom:80px;z-index:2000;width:min(430px,calc(100vw - 40px));height:min(660px,calc(100vh - 110px));display:none;flex-direction:column;background:rgba(255,255,255,.97);border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden}
#aiHead{padding:12px 14px;background:var(--primary);color:#fff;display:flex;justify-content:space-between;align-items:center;font-weight:700}
#aiHead button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer}
#aiSet{padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid #eee}
#aiSet select,#aiSet button{font:inherit;font-size:13px;padding:6px 8px;border-radius:10px;border:1px solid #ddd;background:#fff}
#aiSet button.go{background:var(--secondary);color:#fff;border:none;font-weight:700}
#aiLog{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.aiM{max-width:90%;padding:10px 14px;border-radius:16px;background:#C5ECBE;color:#243B5D}
.aiM.me{align-self:flex-end;background:#ACDEAA;color:#1A1A74}
.aiM .z{font-size:1.25em;display:block}.aiM .p{font-size:.85em;color:var(--secondary);display:block}.aiM .v{font-size:.88em;opacity:.8;display:block;margin-top:2px}
.aiM .fx,.aiM .tp{margin-top:6px;padding:6px 9px;border-radius:10px;font-size:.88em}
.aiM .fx{background:#e8f3ea}.aiM .tp{background:#fff4d6}
.aiM .row button{border:1px solid #ccc;background:#fff;border-radius:8px;font-size:12px;padding:3px 8px;margin:6px 4px 0 0;cursor:pointer}
.aiw{color:var(--secondary)}
#aiBar{display:flex;gap:6px;padding:10px;border-top:1px solid #eee}
#aiBar input{flex:1;font:inherit;padding:9px 12px;border:1px solid #ddd;border-radius:12px;min-width:0}
#aiBar button{border:1px solid #ddd;background:#fff;border-radius:12px;padding:0 12px;cursor:pointer;font:inherit}
#aiBar button.snd{background:var(--primary);color:#fff;border:none}
#aiMic.rec{background:#e11d48;color:#fff}
</style>
</head>

<body>
<div class="app">
  <div class="header">
    <img src="https://png.pngtree.com/png-vector/20240619/ourlarge/pngtree-cute-funny-cartoon-hedgehog-illustration-png-image_12798668.png" alt="Logo" class="header-logo">
    Mandarin
  </div>

  <div class="app-container">

    <!-- CỘT 1 -->
    <div class="col-sidebar">
      <div id="sheetTabs">
        <button class="tab-btn active" onclick="changeSheet('Sheet1', this)">Thuế</button>
        <button class="tab-btn" onclick="changeSheet('thời gian', this)">Thời gian</button>
        <button class="tab-btn" onclick="changeSheet('Chức danh', this)">Chức danh</button>
        <button class="tab-btn" onclick="changeSheet('thời gian và chế độ làm việc', this)">thời gian và chế độ làm việc</button>
        <button class="tab-btn" onclick="changeSheet('找 (zhǎo)', this)">找 (zhǎo)</button>
        <button class="tab-btn" onclick="changeSheet('Gia đình', this)">Gia đình</button>
      </div>
      <div class="music-box">
        <span style="font-size: 12px; font-weight: bold; color: var(--primary);">🎧 Music Player</span>
        <iframe width="100%" height="120" src="https://www.youtube.com/embed/hMDfBaNfLt4?si=cUDFwgx4-7jjKYki" frameborder="0" style="border-radius:10px; margin-top:8px;"></iframe>
      </div>
    </div>

    <!-- CỘT 2 -->
    <div class="col-main">
      <div class="glass-card main-flashcard">
        <div class="progress-container"><div id="bar" class="bar"></div></div>

        <img id="mainWordImage" src="" alt="Minh họa">

        <div style="flex: 1;">
          <div id="pinyin" style="font-size: 1.5rem; color: #888; font-weight: 500;"></div>
          <div id="word" class="word-display"></div>
          <div id="meaning" style="display:none; font-size: 1.3rem; color: var(--secondary); font-weight: 600; margin-bottom: 20px;"></div>

          <div class="controls" style="justify-content: flex-start; gap: 15px;">
            <button class="btn-premium" onclick="prevWord()"><img src="https://cdn-icons-png.flaticon.com/512/271/271220.png" width="18"></button>
            <button class="btn-premium" onclick="playAudio()"><img src="https://cdn-icons-png.flaticon.com/512/727/727269.png" width="20"></button>

            <select id="globalSpeed" class="btn-speed" style="border: none; border-radius: 15px; padding: 0 10px; font-weight: bold; background: #fff; box-shadow: 5px 5px 15px #d1d9e6;">
              <option value="0.5">🐢 Slow</option>
              <option value="1.0" selected>🚶 Normal</option>
              <option value="1.5">⚡ Fast</option>
            </select>

            <button class="btn-premium" onclick="toggleMeaning()"><img src="https://cdn-icons-png.flaticon.com/512/709/709612.png" width="20"></button>
            <button class="btn-premium" onclick="animateStroke()"><img src="https://cdn-icons-png.flaticon.com/512/1159/1159633.png" width="18"></button>
            <button class="btn-premium" onclick="nextWord()"><img src="https://cdn-icons-png.flaticon.com/512/271/271228.png" width="18"></button>
          </div>
        </div>
      </div>

      <div id="exampleBox" style="margin-top: 30px;"></div>
    </div>

    <!-- CỘT 3 -->
    <div class="col-extra">
      <div class="card">
        <h4 style="margin:0 0 10px 0; color:var(--primary); font-size:14px;">✍️ Tập Viết</h4>
        <div id="writer"></div>
      </div>
      <div class="card" id="imageCard" style="display:none; padding:10px;">
        <img id="wordImageSidebar" src="" style="width:100%; border-radius:15px">
      </div>
    </div>

    <!-- CỘT 4 -->
    <div class="col-chat">
      <div id="dialogueBox"></div>
    </div>

  </div>
</div>

<!-- ===== AI LUYỆN NÓI (HTML) ===== -->
<button id="aiFab" onclick="aiToggle()">🗣️ Luyện nói AI</button>
<div id="aiPanel">
  <div id="aiHead"><span>🗣️ Nói chuyện cùng AI</span><button onclick="aiToggle()">✕</button></div>
  <div id="aiSet">
    <select id="aiLevel"><option>HSK 1-2</option><option>HSK 3-4</option><option>HSK 5+</option></select>
    <select id="aiScene">
      <option value="__words">📚 Theo từ đang học</option>
      <option>Làm quen bạn mới</option><option>Gọi đồ ở quán ăn</option><option>Mua sắm, mặc cả</option>
      <option>Hỏi đường, đi taxi</option><option>Nói chuyện với đồng nghiệp</option><option>Hẹn bạn đi chơi</option>
      <option>Làm việc, thuế, kế toán</option>
    </select>
    <button class="go" onclick="aiStart()">Bắt đầu</button>

  </div>
  <div id="aiLog"></div>
  <div id="aiBar">
    <button id="aiMic" onclick="aiMic()" title="Nói">🎤</button>
    <button id="aiLang" onclick="aiLang()" title="Ngôn ngữ nói">中</button>
    <input id="aiInp" placeholder="Gõ tiếng Trung hoặc tiếng Việt…" autocomplete="off" onkeydown="if(event.key==='Enter')aiSend()">
    <button class="snd" onclick="aiSend()">Gửi</button>
  </div>
</div>

<script>
/* ===== KẾT NỐI APPS SCRIPT (thay link /exec của bạn vào đây) ===== */
const GAS_URL="https://script.google.com/macros/s/AKfycbzGibrJgH-3hmylqUtMCG26q4r9WQ14IDrBXQ8DqBlSzFDdrDv6ex7DltmWQEDdtJz8rw/exec";
const google={script:{run:{withSuccessHandler(ok){return{withFailureHandler(bad){return{chatAI(p){
  if(!GAS_URL.startsWith("https://")){bad({message:"Chưa dán link /exec vào GAS_URL trong index.html"});return}
  let code="";try{code=localStorage.getItem("moeCode")||""}catch(e){}
  fetch(GAS_URL,{method:"POST",body:JSON.stringify(Object.assign({code:code},p))})
    .then(r=>r.json())
    .then(r=>{
      if(r&&r.error==="Sai mã truy cập"){const c=prompt("Nhập mã truy cập:");if(c){try{localStorage.setItem("moeCode",c)}catch(e){}}}
      ok(r)})
    .catch(bad)
}}}}}}};
</script>
<script>
const BASE_URL = "https://opensheet.elk.sh/1XiXctUYzEZ9P3Vlw3bB4mLxuBhShgaYDTjBs4tODb5o";
let URL = `${BASE_URL}/Sheet1`;
let data=[], index=0, writers=[];

async function load(){
  try {
    const res = await fetch(URL);
    data = await res.json();
    render();
  } catch (e) { console.error(e); }
}

async function changeSheet(sheetName, element) {
  document.querySelectorAll('.tab-btn').forEach(tab => tab.classList.remove('active'));
  element.classList.add('active');
  URL = `${BASE_URL}/${sheetName}`;
  index = 0;
  load();
}

function getPinyin(t){ return pinyinPro.pinyin(t,{toneType:'mark'}); }

async function translate(t){
  try {
    const res = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=vi&dt=t&q="+encodeURIComponent(t));
    const d = await res.json();
    return d[0][0][0];
  } catch(e) { return "..."; }
}

async function render(){
  if(!data.length) return;
  const item = data[index];

  const imgCard = document.getElementById("imageCard");
  const sidebarImg = document.getElementById("wordImageSidebar");
  const sidebarUrl = item["Hình ảnh"];
  if (sidebarUrl) { sidebarImg.src = sidebarUrl; imgCard.style.display = "block"; }
  else { imgCard.style.display = "none"; }

  const mainImg = document.getElementById("mainWordImage");
  const mainUrl = item["Hình ảnh minh hoạ"] || item["Hình ảnh"];
  if (mainUrl) { mainImg.src = mainUrl; mainImg.style.display = "block"; }
  else { mainImg.style.display = "none"; }

  const wEl=document.getElementById("word");
  wEl.innerHTML="";
  item["Từ"].split("").forEach(c => {
    const s=document.createElement("span"); s.innerText=c; wEl.appendChild(s);
  });

  document.getElementById("pinyin").innerText=getPinyin(item["Từ"]);

  const meaningEl = document.getElementById("meaning");
  if (item["Ý nghĩa"]) { meaningEl.innerText = item["Ý nghĩa"]; }
  else { meaningEl.innerText = await translate(item["Từ"]); }

  const writerBox = document.getElementById("writer");
  writerBox.innerHTML=""; writers=[];
  item["Từ"].split("").forEach((c,i)=>{
    const d=document.createElement("div"); d.id="w"+i; writerBox.appendChild(d);
    writers.push(HanziWriter.create(d.id, c, { width: 80, height: 80, padding: 5, strokeColor: '#c0504d' }));
  });

  renderExample();
  updateBar();
}

async function renderExample() {
  const box = document.getElementById("exampleBox");
  const keyword = data[index]["Từ"];
  const ex = data[index]["Ví dụ"];
  if (!ex) { box.innerHTML = ""; renderDialogue(); return; }

  const lines = ex.split(/[.\n。]/).filter(l => l.trim() !== "");
  let html = `<div style="font-weight: bold; color: DARK GREEN; margin: 20px 0 10px 0; font-size: 1.1rem;">💡 MẪU CÂU</div>`;

  for (let i = 0; i < lines.length; i++) {
    const text = lines[i];
    const vi = await translate(text);
    const boldText = text.replace(new RegExp(keyword, 'g'), `<b style="color:var(--secondary)">${keyword}</b>`);

    html += `
      <div class="example-card glass-card" style="margin-bottom: 12px; padding: 15px; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 12px;">
           <button class="btn-premium" style="width: 32px; height: 32px; border-radius: 10px;" onclick="speakEx('${text}', ${i})">
             <span style="font-size: 14px;">🔊</span>
           </button>
           <span style="font-size: 1.2rem; font-weight: 600; color: #333;">${boldText}</span>
        </div>

        <div style="display: flex; align-items: center; gap: 10px; margin-left: 44px;">
           <small style="color:#888; font-style: italic;">${getPinyin(text)}</small>
           <select id="speedEx${i}" style="font-size: 10px; border: none; background: #eee; border-radius: 4px; padding: 2px 5px; color: #666;">
              <option value="0.6">0.6x</option>
              <option value="0.8">0.8x</option>
              <option value="1.0" selected>1.0x</option>
           </select>
        </div>

        <div style="margin-left: 44px; font-size: 1rem; color: var(--primary); font-weight: 500; border-top: 1px dashed rgba(0,0,0,0.05); padding-top: 5px;">
           ${vi}
        </div>
      </div>`;
  }
  box.innerHTML = html;
  renderDialogue();
}

function speakEx(text, i) {
  const speed = document.getElementById("speedEx" + i).value;
  let u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  u.rate = parseFloat(speed);
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

async function renderDialogue() {
  const box = document.getElementById("dialogueBox");
  const rawData = data[index]["Đối thoại"];
  if (!rawData) { box.innerHTML = ""; return; }

  const lines = rawData.split('\n').filter(l => l.trim() !== "");
  const avatarGirl = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR72QbXjU7Angg5sdUpr3KNbscz3nMw2VRtWCb8Q7IqWA&s";
  const avatarBoy = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQyfeIG6DOAZMJY0v64u4Eh8fete4MWon4eaA&s";

  let html = `<div style="text-align:center; font-weight:bold; color:var(--primary); background: #fdf2f8; padding: 10px; border-radius: 15px; margin-bottom: 15px; border: 1px dashed #ec4899;">🌸 ${lines[0]}</div>`;

  for (let i = 1; i < lines.length; i++) {
    const parts = lines[i].split('/');
    if (parts.length >= 3) {
      const zh = parts[0].trim();
      const py = parts[1].trim();
      const vi = parts[2].trim();
      const isLeft = i % 2 !== 0;
      const avatar = isLeft ? avatarGirl : avatarBoy;

      html += `
        <div style="display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; flex-direction: ${isLeft ? 'row' : 'row-reverse'}">
          <img src="${avatar}" style="width: 45px; height: 45px; border-radius: 50%; background: white; border: 2px solid ${isLeft ? '#fbcfe8' : '#bfdbfe'};">
          <div class="bubble ${isLeft ? 'left' : 'right'}" style="margin: 0; position: relative;">
            <span class="py" style="font-size: 0.85em; color: #666;">${py}</span>
            <span class="zh" style="display: block; margin: 4px 0;">
              ${isLeft ? `<button class="btn-audio-mini" onclick="speakText('${zh}')">🔊</button> ${zh}` : `${zh} <button class="btn-audio-mini" onclick="speakText('${zh}')">🔊</button>`}
            </span>
            <span class="vi" style="display: block; font-size: 0.9em; opacity: 0.85; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 3px;">${vi}</span>
          </div>
        </div>`;
    }
  }
  box.innerHTML = html;
}

function speakText(text) {
  let u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function playAudio(){ speakText(data[index]["Từ"]); }
function animateStroke(){ writers.forEach((w, i) => setTimeout(() => w.animateCharacter(), i * 800)); }
function nextWord(){ index=(index+1)%data.length; render(); }
function prevWord(){ index=(index-1+data.length)%data.length; render(); }
function toggleMeaning(){ const m = document.getElementById("meaning"); m.style.display = m.style.display==="none"?"block":"none"; }
function updateBar(){ document.getElementById("bar").style.width=((index + 1)/data.length)*100+"%"; }

load();

/* ===== AI LUYỆN NÓI (JS) ===== */
const AI={hist:[],busy:false,rec:null,zh:true,words:[]};
const $a=id=>document.getElementById(id);
function aiEsc(s){const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
function aiHL(t){let h=aiEsc(t);AI.words.forEach(w=>{if(w)h=h.split(aiEsc(w)).join('<b class="aiw">'+aiEsc(w)+'</b>')});return h}
function aiAdd(html,cls){const d=document.createElement("div");d.className="aiM "+(cls||"");d.innerHTML=html;$a("aiLog").appendChild(d);$a("aiLog").scrollTop=1e9;return d}
function aiSpeak(t,rate){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=rate||0.9;speechSynthesis.speak(u)}catch(e){}}
function aiToggle(){
  const p=$a("aiPanel");const open=p.style.display==="flex";p.style.display=open?"none":"flex";
  if(!open&&!AI.hist.length&&!$a("aiLog").children.length)aiAdd("Chọn trình độ và tình huống rồi bấm <b>Bắt đầu</b>. Chọn <b>“Theo từ đang học”</b> để AI lồng các từ trong sheet hiện tại vào hội thoại.");
}
function aiPickWords(){
  if($a("aiScene").value!=="__words"||!data.length)return [];
  const n=data.length,out=[];
  for(let i=0;i<Math.min(8,n);i++){const w=data[(index+i)%n]["Từ"];if(w)out.push(String(w))}
  return out;
}
function aiStart(){
  AI.hist=[];$a("aiLog").innerHTML="";AI.words=aiPickWords();
  if(AI.words.length)aiAdd("📚 Từ sẽ luyện: "+AI.words.map(aiEsc).join("、"));
  aiTurn("");
}
function aiSend(){
  const v=$a("aiInp").value.trim();if(!v)return;
  if(!AI.hist.length&&!AI.words.length)AI.words=aiPickWords();
  $a("aiInp").value="";aiTurn(v);
}
function aiTurn(msg){
  if(AI.busy)return;
  if(typeof google==="undefined"||!google.script){aiAdd("AI chỉ chạy khi mở app qua link Web App của Apps Script.");return}
  AI.busy=true;
  if(msg)aiAdd(aiEsc(msg),"me");
  const wait=aiAdd("Đang suy nghĩ…");
  const sc=$a("aiScene").value==="__words"?"Trò chuyện đời thường":$a("aiScene").value;
  google.script.run
    .withSuccessHandler(r=>{
      wait.remove();AI.busy=false;
      if(!r||r.error){aiAdd("Lỗi: "+aiEsc(r&&r.error||"không có phản hồi"));return}
      if(msg)AI.hist.push({role:"user",text:msg});
      AI.hist.push({role:"ai",text:r.zh});
      let h='<span class="z">'+aiHL(r.zh)+'</span><span class="p">'+aiEsc(r.pinyin)+'</span><span class="v">'+aiEsc(r.vi)+'</span>';
      if(r.fix)h+='<div class="fx">✏️ <b>Sửa nhẹ:</b> '+aiEsc(r.fix)+'</div>';
      if(r.tip)h+='<div class="tp">💡 <b>Người bản xứ hay nói:</b> '+aiEsc(r.tip)+'</div>';
      h+='<div class="row"><button data-s="0.95">🔊 Nghe</button><button data-s="0.55">🐢 Chậm</button></div>';
      const d=aiAdd(h);
      d.querySelectorAll("button").forEach(b=>b.onclick=()=>aiSpeak(r.zh,parseFloat(b.dataset.s)));
      aiSpeak(r.zh,0.9);
    })
    .withFailureHandler(e=>{wait.remove();AI.busy=false;aiAdd("Lỗi kết nối: "+aiEsc(e&&e.message||e))})
    .chatAI({scene:sc,level:$a("aiLevel").value,words:AI.words,history:AI.hist,userMsg:msg});
}
function aiLang(){AI.zh=!AI.zh;$a("aiLang").textContent=AI.zh?"中":"VI"}
function aiMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){aiAdd("Trình duyệt không hỗ trợ nhận giọng nói. Hãy dùng Chrome hoặc Edge.");return}
  if(AI.rec){AI.rec.stop();return}
  try{speechSynthesis.cancel()}catch(e){}
  const r=new SR(),base=$a("aiInp").value;AI.rec=r;
  r.lang=AI.zh?"zh-CN":"vi-VN";r.interimResults=true;
  r.onstart=()=>$a("aiMic").classList.add("rec");
  r.onresult=e=>{let t="";for(const x of e.results)t+=x[0].transcript;$a("aiInp").value=base+t};
  r.onend=()=>{$a("aiMic").classList.remove("rec");AI.rec=null;if($a("aiAuto").checked&&$a("aiInp").value.trim()&&!AI.busy)aiSend()};
  r.onerror=e=>{$a("aiMic").classList.remove("rec");AI.rec=null;
    aiAdd(e.error==="not-allowed"||e.error==="service-not-allowed"?"Micro đang bị chặn. Bấm biểu tượng ổ khóa cạnh thanh địa chỉ, chọn Cho phép micro rồi thử lại.":"Không nghe được ("+aiEsc(e.error)+")")};
  try{r.start()}catch(e){AI.rec=null}
}
</script>
